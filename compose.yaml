name: govtracts

services:
  api:
    image: govtracts-api:local
    build:
      context: ./services/api
    restart: unless-stopped
    env_file:
      - ./services/api/.env
    networks:
      - govtracts_internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    image: govtracts-web:local
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - govtracts_internal
      - homelab_proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  govtracts_internal:
    name: govtracts_internal
  homelab_proxy:
    external: true
    name: homelab_proxy
